services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agentprobe
      POSTGRES_PASSWORD: agentprobe
      POSTGRES_DB: agentprobe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentprobe"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]   # trace UI: http://localhost:16686
  api:
    build: .
    environment: &env
      DATABASE_URL: postgresql+psycopg://agentprobe:agentprobe@db/agentprobe
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["8000:8000"]
    depends_on: &deps
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      jaeger: { condition: service_started }
  worker:
    build: .
    command: ["agentprobe", "worker"]
    environment: *env
    depends_on: *deps
    deploy:
      replicas: 2
