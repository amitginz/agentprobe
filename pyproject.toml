[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe-evals"
version = "0.2.0"
description = "Evaluation and regression-testing platform for LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amit Ginzberg" }]
keywords = ["llm", "agents", "evaluation", "regression-testing", "mcnemar", "llm-as-judge", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "redis>=5.0",
    "opentelemetry-api>=1.25",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "fakeredis>=2.23", "pyyaml>=6", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
postgres = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/amitginz/agentprobe"
Source = "https://github.com/amitginz/agentprobe"
Issues = "https://github.com/amitginz/agentprobe/issues"

[project.scripts]
agentprobe = "agentprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentprobe = ["dashboard/*.html", "migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
