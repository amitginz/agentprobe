[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe"
version = "0.1.0"
description = "Evaluation and regression-testing platform for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "fakeredis>=2.23"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
agentprobe = "agentprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentprobe = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
