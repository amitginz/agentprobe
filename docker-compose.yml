services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agentprobe
      POSTGRES_PASSWORD: agentprobe
      POSTGRES_DB: agentprobe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentprobe"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://agentprobe:agentprobe@db/agentprobe
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
