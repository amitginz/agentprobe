name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: package builds and passes twine checks
        run: pip install build twine && python -m build && twine check dist/*
  agent-quality-gate:
    # Dogfooding the reusable action in this repo: the candidate is a deliberately identical
    # configuration, so this job passes; point it at your own agent endpoints in real use.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: probe
        with:
          dataset: examples/dataset.json
          baseline-agent: "mock:accuracy=0.9,seed=1"
          candidate-agent: "mock:accuracy=0.9,seed=1"
      - run: echo "verdict=${{ steps.probe.outputs.verdict }}"
